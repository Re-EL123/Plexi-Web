<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="assets/icons/logo.jpg">
  <link rel="manifest" href="manifest.json?v=2">
  <meta name="theme-color" content="#4361ee">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help — Plexi Digital Mall</title>
  <link rel="stylesheet" href="assets/css/variables.css?v=2">
  <link rel="stylesheet" href="assets/css/base.css?v=2">
  <link rel="stylesheet" href="assets/css/neomorphism.css?v=2">
  <link rel="stylesheet" href="assets/css/components.css?v=6">
  <link rel="stylesheet" href="assets/css/animations.css?v=4">
  <link rel="stylesheet" href="assets/css/responsive.css?v=2">
  <style>
    html, body { overflow-x: clip; }
    .nav-sticky {
      position:sticky;top:0;z-index:var(--z-dropdown);
      background:rgba(240,240,243,0.88);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border-light);
    }
    .nav-inner {
      max-width:1280px;margin:0 auto;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 var(--space-lg);height:var(--header-h);gap:var(--space-md);
    }
    .logo {
      display:flex;align-items:center;gap:10px;
      font-family:var(--font-display);font-size:22px;font-weight:800;
      color:var(--text-primary);text-decoration:none;
    }
    .logo img{width:36px;height:36px;border-radius:9px;object-fit:cover;}
    footer{background:var(--gray-900);color:rgba(255,255,255,0.6);padding:var(--space-xl) 0;}
    .footer-inner{max-width:1280px;margin:0 auto;padding:0 var(--space-lg);display:flex;justify-content:space-between;gap:var(--space-lg);flex-wrap:wrap;}
    .footer-col a{display:block;color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:8px;}
    .footer-col a:hover{color:white;}
    .footer-bottom{border-top:1px solid rgba(255,255,255,0.08);margin-top:var(--space-lg);padding:var(--space-md) var(--space-lg) 0;text-align:center;font-size:12px;}
  </style>
</head>
<body>
<nav class="nav-sticky">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <img src="assets/icons/logo.jpg" alt="Plexi">
      Plexi<span style="color:var(--primary)">Mall</span>
    </a>
    <div style="display:flex;align-items:center;gap:var(--space-sm);">
      <a href="index.html" class="btn btn-ghost btn-sm">Home</a>
      <div id="nav-auth" class="nav-auth-area" style="display:flex;align-items:center;gap:var(--space-sm);"></div>
    </div>
  </div>
</nav>

<main class="legal-page">
  <nav class="legal-tabs" id="legal-tabs" aria-label="Help pages"></nav>
  <h1 class="legal-title" id="legal-title">Help</h1>
  <p class="legal-meta" id="legal-meta"></p>
  <div id="legal-body" class="markdown-body"></div>
</main>

<footer>
  <div class="footer-inner">
    <div>
      <strong style="color:#fff;">Plexi Mall</strong>
      <p style="font-size:13px;margin-top:8px;max-width:280px;">South Africa's virtual shopping mall.</p>
    </div>
    <div class="footer-col">
      <a href="legal.html?page=faq">FAQs</a>
      <a href="legal.html?page=guide">How it works</a>
      <a href="legal.html?page=terms">Terms</a>
      <a href="legal.html?page=privacy">Privacy</a>
    </div>
  </div>
  <div class="footer-bottom"><p>© 2026 Plexi Digital Mall. All rights reserved.</p></div>
</footer>
<div id="toast-container"></div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/ui.js?v=10"></script>
<script src="assets/js/api.js?v=7"></script>
<script src="assets/js/auth.js?v=2"></script>
<script src="assets/js/site-content-defaults.js?v=1"></script>
<script src="assets/js/site-content.js?v=1"></script>
<script>
  const raw = (new URLSearchParams(location.search).get('page') || 'faq').toLowerCase();
  const page = SiteContent.PAGES[raw] ? (raw === 'faqs' ? 'faq' : raw) : 'faq';
  const slug = SiteContent.PAGES[page].slug;
  document.title = SiteContent.PAGES[page].label + ' — Plexi Digital Mall';

  document.getElementById('legal-tabs').innerHTML = ['faq','guide','terms','privacy'].map((p) =>
    `<a href="legal.html?page=${p}" class="${p===page?'active':''}">${SiteContent.PAGES[p].label}</a>`
  ).join('');

  const host = document.getElementById('nav-auth');
  if (host) SiteContent.mountHelpMenu(host);
  if (Auth.isLoggedIn()) {
    const u = Auth.getUser();
    const dash = CONFIG.ROLE_DASHBOARDS[u?.role] || 'login.html';
    const a = document.createElement('a');
    a.href = dash;
    a.className = 'btn btn-primary btn-sm';
    a.textContent = 'My account';
    host.appendChild(a);
  } else {
    const a = document.createElement('a');
    a.href = 'login.html';
    a.className = 'btn btn-primary btn-sm';
    a.textContent = 'Sign in';
    host.appendChild(a);
  }

  (async () => {
    const doc = await SiteContent.load(slug);
    document.getElementById('legal-title').textContent = doc.title || SiteContent.PAGES[page].label;
    const updated = SiteContent.formatUpdated(doc.updated_at);
    document.getElementById('legal-meta').textContent = updated ? ('Last updated ' + updated) : (doc.source === 'default' ? 'Standard mall copy — an admin can replace this in Content.' : '');
    const body = document.getElementById('legal-body');
    if (slug === 'faqs') SiteContent.renderFaqs(doc.items, body);
    else {
      let md = doc.body || '';
      const t = (doc.title || '').trim();
      if (t) md = md.replace(new RegExp('^#\\s+' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\n+', 'i'), '');
      body.innerHTML = SiteContent.renderMarkdown(md);
    }
  })();
</script>
</body>
</html>
